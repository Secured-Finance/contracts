name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  pull_request:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Retry a version-changing commit already merged into Public main'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-package:
    if: vars.IS_MIRROR_REPOSITORY != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run compile
      - run: npm pack --dry-run

  publish:
    if: vars.IS_MIRROR_REPOSITORY != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: contracts-package
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the released commit
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          cp scripts/release/publish-package.sh "$RUNNER_TEMP/publish-package.sh"
          bash "$RUNNER_TEMP/publish-package.sh" select
      - uses: actions/setup-node@v4
        if: steps.release.outputs.version != ''
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: ${{ steps.release.outputs.scope }}
      - name: Build the package
        if: steps.release.outputs.version != ''
        run: |
          npm ci
          npm run compile
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
      - name: Publish the package and record its Git tag
        if: steps.release.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: bash "$RUNNER_TEMP/publish-package.sh" publish
